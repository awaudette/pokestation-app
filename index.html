<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Poké Station App</title>
  <script>
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isAndroid = /Android/.test(navigator.userAgent);
    
    if (isIOS) {
      window.location.href = "https://apps.apple.com/ca/app/pok%C3%A9-station/id6759538183?l=fr-CA";
    } else if (isAndroid) {
      window.location.href = "GOOGLEPLAY_URL_ICI";
    } else {
      document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("links").style.display = "block";
      });
    }
  </script>
</head>
<body>
  <div id="links" style="display:none; text-align:center; font-family:sans-serif; padding:40px;">
    <h2>Télécharger l'app Poké Station</h2>
    <br>
    <a href="https://apps.apple.com/ca/app/pok%C3%A9-station/id6759538183?l=fr-CA">📱 App Store (iOS)</a>
    <br><br>
    <a href="GOOGLEPLAY_URL_ICI">🤖 Google Play (Android)</a>
  </div>
</body>
</html>
